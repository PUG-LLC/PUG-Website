# 本番デプロイ（GitHub Actions → Vercel CLI → 既存 Project: zen-llc/pug-creative-studio）
#
# 起動条件
#   - push (main)        : リポジトリ変数 PRODUCTION_AUTO_DEPLOY が 'true' のときのみ本番デプロイ。
#                          未設定の間はジョブ自体がスキップされる（段階移行用のゲート）。
#   - workflow_dispatch  : main のみ。入力 deploy=false（既定）は pull + build のみのドライラン、
#                          deploy=true で本番デプロイ。
#
# Secrets / Variables は GitHub Environment "Production" に登録されたものを参照する。
#   secrets.VERCEL_TOKEN / vars.VERCEL_ORG_ID / vars.VERCEL_PROJECT_ID
#
# 詳細は docs/deploy.md を参照。
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "true で本番にデプロイ。false はビルド検証のみ（ドライラン）"
        type: boolean
        default: false

permissions:
  contents: read

# 本番への同時デプロイを防ぐ（実行中のデプロイは中断せず、後続は待機させる）
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel Production
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.PRODUCTION_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: Production
      url: https://www.pug-cs.com
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
      # 誤デプロイ防止: デプロイ先として許可する唯一の Project
      EXPECTED_PROJECT_ID: prj_hZKfDPQ5h35bByyJ1ljZEnkylkmw
      EXPECTED_PROJECT_NAME: pug-creative-studio
      VERCEL_CLI_VERSION: 61.1.0
      DO_DEPLOY: ${{ github.event_name == 'push' || inputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vercel Project の Node.js Version (22.x) に合わせる
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Verify deploy target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID が Production Environment に設定されていません"
            exit 1
          fi
          if [ "${VERCEL_PROJECT_ID}" != "${EXPECTED_PROJECT_ID}" ]; then
            echo "::error::VERCEL_PROJECT_ID が想定の Project (${EXPECTED_PROJECT_NAME}) と一致しません"
            exit 1
          fi
          project=$(curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          name=$(jq -r '.name' <<<"${project}")
          account=$(jq -r '.accountId' <<<"${project}")
          if [ "${name}" != "${EXPECTED_PROJECT_NAME}" ] || [ "${account}" != "${VERCEL_ORG_ID}" ]; then
            echo "::error::Vercel 上の Project が想定と一致しません (name=${name})"
            exit 1
          fi
          echo "Deploy target verified: ${name}"

      - name: Pull Vercel environment (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy to Production
        if: env.DO_DEPLOY == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")
          echo "Deployment: ${url}"
          echo "### Production deployment: ${url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Smoke test
        if: env.DO_DEPLOY == 'true'
        run: |
          set -euo pipefail
          for path in / /news /work /members /contact; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "https://www.pug-cs.com${path}")
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || { echo "::error::${path} returned ${code}"; exit 1; }
          done

      - name: Dry run summary
        if: env.DO_DEPLOY != 'true'
        run: |
          echo "### Dry run: build succeeded, nothing was deployed" >> "${GITHUB_STEP_SUMMARY}"
